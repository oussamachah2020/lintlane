    <div class="chips">
      <button type="button" class="chip" data-level="all" aria-pressed="true">All</button>
      <button type="button" class="chip" data-level="error" aria-pressed="false">Errors</button>
      <button type="button" class="chip" data-level="warning" aria-pressed="false">Warnings</button>
    </div>
  </div>
  <div class="layout" id="layout">
    <div class="card" id="tableCard"></div>
    <div class="card panel" id="panel" hidden></div>
  </div>
</main>

<main id="view-ci" hidden>
  <div class="page-heading"><div><div class="eyebrow">Continuous integration</div><h2>Workflow runs</h2><p>Run your project checks and inspect the output, step by step.</p></div><span class="environment"><span></span>Local workspace</span></div>
  <div id="ciNotice"></div>
  <div id="ciVerdict"></div>
  <div class="stats" id="ciStats" aria-live="polite"></div>
  <div class="toolbar ci-tools">
    <span class="muted">Local workflow / <strong>Quality checks</strong></span>
    <div class="spacer"></div>
    <button type="button" id="ciRetry" hidden>Re-run failed checks</button>
    <button type="button" id="ciFollow" aria-pressed="true">Follow active step</button>
    <button type="button" id="ciExpand">Expand all logs</button>

  </div>
  <div id="ciLayout">
    <div id="ciSteps"></div>
    <div id="ciPanel"></div>
  </div>
</main>

<script>
const TOKEN = "__TOKEN__";
const $ = (s) => document.querySelector(s);
const statusEl = $("#status"), runBtn = $("#run"), fixAllBtn = $("#fixAll");
let state = null;
let selected = null; // path
let query = "";
let level = "all";

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "content-type": "application/json", "x-lintlane-token": TOKEN },
    body: JSON.stringify(body ?? {}),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const levelName = (sev) => (sev === "information" ? "Info" : sev === "warning" ? "Warn" : "Error");

// Line diff via LCS on trimmed common prefix/suffix; returns hunks with 3 lines of context.
function diffLines(a, b) {
  const x = a.split("\n"), y = b.split("\n");
  let p = 0;
  while (p < x.length && p < y.length && x[p] === y[p]) p++;
  let s = 0;
  while (s < x.length - p && s < y.length - p && x[x.length - 1 - s] === y[y.length - 1 - s]) s++;
  const xm = x.slice(p, x.length - s), ym = y.slice(p, y.length - s);
  const n = xm.length, m = ym.length;
  let ops = [];
  if (n * m > 4_000_000) {
    ops = [...xm.map((t) => ["del", t]), ...ym.map((t) => ["add", t])];
  } else {
    const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
    for (let i = n - 1; i >= 0; i--)
      for (let j = m - 1; j >= 0; j--)
        dp[i][j] = xm[i] === ym[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (xm[i] === ym[j]) { ops.push(["ctx", xm[i]]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push(["del", xm[i++]]);
      else ops.push(["add", ym[j++]]);
    }
    while (i < n) ops.push(["del", xm[i++]]);
    while (j < m) ops.push(["add", ym[j++]]);
  }
  const all = [
    ...x.slice(0, p).map((t) => ["ctx", t]),
    ...ops,
    ...x.slice(x.length - s).map((t) => ["ctx", t]),
  ];
  // number lines and keep only changes ± 3 context
  let oldNo = 1, newNo = 1;
  const rows = all.map(([k, t]) => {
    const r = { k, t, o: k === "add" ? "" : oldNo, n: k === "del" ? "" : newNo };
    if (k !== "add") oldNo++;
    if (k !== "del") newNo++;
    return r;
  });
  const keep = new Array(rows.length).fill(false);
  rows.forEach((r, i) => {
    if (r.k !== "ctx") for (let d = -3; d <= 3; d++) if (keep[i + d] !== undefined) keep[i + d] = true;
  });
  const out = [];
  let skipping = false;
  rows.forEach((r, i) => {
    if (keep[i]) { out.push(r); skipping = false; }
    else if (!skipping) { out.push({ k: "gap", t: "···", o: "", n: "" }); skipping = true; }
  });
  return out;
}


function worst(f) {
  if (f.diagnostics.some((d) => d.severity === "error")) return "error";
  if (f.diagnostics.some((d) => d.severity === "warning")) return "warning";
  return "information";
}

function visibleFiles() {
  if (!state) return [];
  const q = query.trim().toLowerCase();
  return state.files.filter((f) => {
    if (level !== "all" && !f.diagnostics.some((d) => d.severity === level)) return false;
    if (!q) return true;
    return f.path.toLowerCase().includes(q) || f.diagnostics.some((d) => d.message.toLowerCase().includes(q) || d.category.toLowerCase().includes(q));
  });
}

function renderDiff(f) {
  if (f.diff === undefined || f.diff === "loading") return `<div class="note">Loading proposed fix…</div>`;
  if (f.diff.error) return `<div class="note">Couldn't load the fix: ${esc(f.diff.error)}</div>`;
  if (!f.diff.fixable) return `<div class="note">No automatic fix available — these need a manual change.</div>`;
  const rows = diffLines(f.diff.original, f.diff.fixed);
  const html = rows.map((r) => {
    const sign = r.k === "add" ? "+" : r.k === "del" ? "−" : "";
    return `<div class="line mono ${r.k}"><span class="no">${r.o}</span><span class="no">${r.n}</span><span class="sign">${sign}</span><span>${esc(r.t)}</span></div>`;
  }).join("");
  return `<div class="diff">${html}</div>`;
}

function renderStats() {
  const s = state?.summary;
  const cards = [
    ["err", s?.errors ?? "–", "Errors"],
    ["warn", s?.warnings ?? "–", "Warnings"],
    ["", state?.totalFiles ?? "–", "Files with issues"],
    ["ok", state ? `${state.seconds}s` : "–", "Check time"],
  ];
  $("#stats").innerHTML = cards.map(([c, v, l]) => `<div class="stat ${c}"><b>${v}</b><span>${l}</span></div>`).join("");
}

function renderTable() {
  const files = visibleFiles();
  const card = $("#tableCard");
  if (!state) { card.innerHTML = `<div class="empty"><span class="empty-symbol" aria-hidden="true">⌘</span><strong>Your next clean commit starts here</strong><span>Run a check to review lint and formatting diagnostics.</span></div>`; return; }
  if (state.files.length === 0) { card.innerHTML = `<div class="empty"><span class="empty-symbol fixable" aria-hidden="true">✓</span><strong>No issues found</strong><span>Your code matches the project’s lint and formatting rules.</span></div>`; return; }
  if (files.length === 0) { card.innerHTML = `<div class="empty">No files match your filters.</div>`; return; }
  card.innerHTML = `<table><thead><tr><th>File</th><th>Level</th><th class="num">Issues</th><th>Fix</th></tr></thead><tbody>${files.map((f) => {
    const w = worst(f);
    const fix = f.diff === undefined || f.diff === "loading" ? '<span class="muted">…</span>' : f.diff.fixable ? '<span class="fixable">Fixable</span>' : '<span class="muted">Manual</span>';
    return `<tr data-path="${esc(f.path)}" class="${w === "error" ? "has-err" : ""} ${f.path === selected ? "sel" : ""}">
      <td class="path mono">${esc(f.path)}</td>
      <td class="lvl-${w}"><span class="dot"></span>${levelName(w)}</td>
      <td class="num">${f.diagnostics.length}</td><td>${fix}</td></tr>`;
  }).join("")}</tbody></table>`;
}

function renderPanel() {
  const panel = $("#panel"), layout = $("#layout");
  const files = visibleFiles();
  const idx = files.findIndex((f) => f.path === selected);
  const f = idx >= 0 ? files[idx] : null;
  panel.hidden = !f;
  layout.classList.toggle("has-panel", !!f);
  if (!f) return;
  panel.innerHTML = `<div class="panel-head">
      <span class="path mono">${esc(f.path)}</span>
      ${f.diff?.fixable ? '<button type="button" data-act="fix">Apply fix</button>' : ""}
      <button type="button" class="icon" data-act="prev" aria-label="Previous file" ${idx === 0 ? "disabled" : ""}>↑</button>
      <button type="button" class="icon" data-act="next" aria-label="Next file" ${idx === files.length - 1 ? "disabled" : ""}>↓</button>
      <button type="button" class="icon" data-act="close" aria-label="Close">✕</button></div>
    <h3>${plural(f.diagnostics.length, "issue")}</h3>
    ${f.diagnostics.map((d) => `<div class="diag">
      <span class="sev ${esc(d.severity)}">${esc(levelName(d.severity))}</span>
      <div><div>${esc(d.category === "format" ? "File isn't formatted to the project style (see the diff below)." : d.message)}</div>
      <div class="meta mono">${esc(d.category)}${d.start?.line ? ` · line ${d.start.line}:${d.start.column}` : ""}</div></div></div>`).join("")}
    <h3>Proposed fix</h3>${renderDiff(f)}`;
}

function render() {
  renderStats();
  renderTable();
  renderPanel();
  const n = state?.files.length ?? 0;
  fixAllBtn.disabled = n === 0;
  fixAllBtn.textContent = n ? `Apply all fixes (${plural(n, "file")})` : "Apply all fixes";
  $("#notice").innerHTML = state?.truncated
    ? `<div class="error-box">Showing the first ${n} of ${state.totalFiles} files. “Apply all fixes” only touches the files shown.</div>` : "";
}

async function ensureDiff(f) {
  if (!f || f.diff !== undefined) return;
  f.diff = "loading";
  render();
  try { f.diff = await api("/api/diff", { file: f.path }); }
  catch (e) { f.diff = { error: e.message }; }
  render();
}

function select(path) {
  selected = path;
  render();
  ensureDiff(state.files.find((f) => f.path === path));
}

async function run() {
  runBtn.disabled = true;
  const t0 = Date.now();
  const tick = setInterval(() => { statusEl.textContent = `checking… ${Math.round((Date.now() - t0) / 1000)}s`; }, 500);
  statusEl.textContent = "checking…";
  try {
    state = await api("/api/check");
    state.seconds = ((Date.now() - t0) / 1000).toFixed(1);
    selected = state.files[0]?.path ?? null;
    statusEl.textContent = state.files.length ? "issues found" : "clean";
    render();
    if (selected) ensureDiff(state.files[0]);
    prefetch(state.files.slice(1, 30));
  } catch (e) {
    $("#notice").innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
    statusEl.textContent = "error";
  } finally { clearInterval(tick); runBtn.disabled = false; }
}

// Load diffs in the background, a few at a time, so the Fix column fills in.
async function prefetch(files) {
  const queue = files.filter((f) => f.diff === undefined);
  const worker = async () => {
    for (let f = queue.shift(); f; f = queue.shift()) {
      if (f.diff !== undefined) continue;
      f.diff = "loading";
      try { f.diff = await api("/api/diff", { file: f.path }); }
      catch (e) { f.diff = { error: e.message }; }
      if (state?.files.includes(f)) { renderTable(); if (f.path === selected) renderPanel(); }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
}

async function fix(paths) {
  statusEl.textContent = "applying…";
  try { await api("/api/fix", { files: paths }); await run(); }
  catch (e) { $("#notice").innerHTML = `<div class="error-box">${esc(e.message)}</div>`; statusEl.textContent = "error"; }
}

function step(delta) {
  const files = visibleFiles();
  const i = files.findIndex((f) => f.path === selected);
  const next = files[i + delta];
  if (next) select(next.path);
}

$("#tableCard").addEventListener("click", (e) => {
  const tr = e.target.closest("tr[data-path]");
  if (tr) select(tr.dataset.path);
});
$("#panel").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "fix") fix([selected]);
  else if (act === "prev") step(-1);
  else if (act === "next") step(1);
  else if (act === "close") { selected = null; render(); }
});
$("#search").addEventListener("input", (e) => { query = e.target.value; render(); });
document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    level = chip.dataset.level;
    for (const c of document.querySelectorAll(".chip")) c.setAttribute("aria-pressed", String(c === chip));
    render();
  });
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); step(-1); }
  else if (e.key === "Escape") { selected = null; render(); }
});
fixAllBtn.addEventListener("click", () => fix(state.files.map((f) => f.path)));
runBtn.addEventListener("click", run);
render();
run();

// ---------------------------------------------------------------- theme
const themeBtn = $("#theme");
const systemDark = window.matchMedia("(prefers-color-scheme: dark)");
const isDark = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : systemDark.matches;
};
function paintTheme() {
  themeBtn.textContent = isDark() ? "☀" : "☾";
  themeBtn.title = isDark() ? "Switch to light mode" : "Switch to dark mode";
}
themeBtn.addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("lintlane-theme", next); } catch {}
  paintTheme();
});
systemDark.addEventListener("change", paintTheme);
paintTheme();

// ---------------------------------------------------------------- views
const views = { lint: { main: $("#view-lint"), actions: $("#lintActions") }, ci: { main: $("#view-ci"), actions: $("#ciActions") } };
let ciLoaded = false;
function showView(name) {
  if (!views[name]) name = "lint";
  for (const [key, v] of Object.entries(views)) {
    v.main.hidden = key !== name;
    v.actions.hidden = key !== name;
  }
  for (const tab of document.querySelectorAll(".tab")) {
    if (tab.dataset.view === name) tab.setAttribute("aria-current", "page");
    else tab.removeAttribute("aria-current");
  }
  try { history.replaceState(null, "", name === "lint" ? location.pathname + location.search : `#${name}`); } catch {}
  if (name === "ci" && !ciLoaded) { ciLoaded = true; ciLoad(); }
}
for (const tab of document.querySelectorAll(".tab")) tab.addEventListener("click", () => showView(tab.dataset.view));

// ---------------------------------------------------------------- CI view
const ci = { steps: null, enabled: new Set(), results: {}, selected: null, run: null, finished: false, startedAt: 0, seconds: null, error: null, follow: true };
ci.cancelled = false;
ci.expanded = new Set();
const ESC = String.fromCharCode(27);
const BEL = String.fromCharCode(7);
const ANSI = new RegExp(`${ESC}\\[[0-9;?]*[ -/]*[@-~]|${ESC}\\][^${BEL}${ESC}]*(?:${BEL}|${ESC}\\\\)`, "g");
const ciRes = (id) => (ci.results[id] ??= { status: "pending", log: "", ms: null });
const fmtMs = (ms) => (ms == null ? "–" : ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(1)}s`);

async function ciLoad() {
  try {
    const { steps, problems } = await api("/api/ci/steps");
    ci.steps = steps;
    ci.problems = [...problems];
    try {
      const report = await api("/api/doctor");
      for (const f of report.findings) {
        if (f.status === "fail") ci.problems.push(`Setup: ${f.message}${f.fix ? ` — ${f.fix}` : ""}`);
      }
    } catch {}
    for (const st of steps) if (st.defaultOn) ci.enabled.add(st.id);
    ci.selected = steps.find((st) => st.defaultOn)?.id ?? steps[0]?.id ?? null;
  } catch (e) { ci.error = e.message; }
  ciRender();
}

function ciStatusCell(r) {
  switch (r?.status) {
    case "running": return '<span class="st-run"><span class="spin"></span>Running</span>';
    case "pass": return '<span class="st-pass">✔ Passed</span>';
    case "fail": return '<span class="st-fail">✘ Failed</span>';
    case "skip": return '<span class="st-skip">– Skipped</span>';
    case "cancelled": return '<span class="st-skip">■ Stopped</span>';
    default: return '<span class="st-pending">○ Pending</span>';
  }
}

function ciRenderStats() {
  const all = Object.values(ci.results);
  const passed = all.filter((r) => r.status === "pass").length;
  const failed = all.filter((r) => r.status === "fail").length;
  const total = ci.run ? Math.round((Date.now() - ci.startedAt) / 1000) : ci.seconds;
  const cards = [
    ["ok", all.length ? passed : "–", "Passed"],
    ["err", all.length ? failed : "–", "Failed"],
    ["", ci.steps ? [...ci.enabled].length : "–", "Steps selected"],
    ["", total == null ? "–" : `${total}s`, "Total time"],
  ];
  $("#ciStats").innerHTML = cards.map(([c, v, l]) => `<div class="stat ${c}"><b>${v}</b><span>${l}</span></div>`).join("");
}

function ciRenderVerdict() {
  const el = $("#ciVerdict");
  if (!ci.finished) { el.innerHTML = ""; return; }
  const res = ci.steps.filter((st) => ci.results[st.id]);
  const failed = res.find((st) => ci.results[st.id].status === "fail");
  const cancelled = ci.cancelled || res.some((st) => ci.results[st.id].status === "cancelled");
  if (cancelled) el.innerHTML = `<div class="verdict">Run stopped.</div>`;
  else if (ci.error) el.innerHTML = `<div class="verdict fail">Run could not complete<small>${esc(ci.error)}</small></div>`;
  else if (failed) el.innerHTML = `<div class="verdict fail">CI would fail<small>First failure: ${esc(failed.label)}. Fix it before pushing.</small></div>`;
  else if (res.length) el.innerHTML = `<div class="verdict pass">All ${plural(res.length, "step")} passed<small>Same checks as your CI workflow, run locally.</small></div>`;
}

function ciRenderTable() {
  const card = $("#ciSteps");
  if (!ci.steps) { card.innerHTML = '<div class="empty">Loading steps…</div>'; return; }
  card.innerHTML = '<div class="ci-jobs-title">Workflow steps<span class="muted">Select checks to include in this run</span></div>' + ci.steps.map((st) => {
    const r = ci.results[st.id];
    return `<div class="ci-job ${st.id === ci.selected ? "sel" : ""}"><input type="checkbox" data-enable="${esc(st.id)}" aria-label="Include ${esc(st.label)}" ${ci.enabled.has(st.id) ? "checked" : ""} ${ci.run ? "disabled" : ""} /><button type="button" data-select="${esc(st.id)}" ${st.id === ci.selected ? 'aria-current="step"' : ""}><b>${esc(st.label)}</b><small>${ciStatusCell(r)} · ${fmtMs(r?.ms)}</small></button></div>`;
  }).join("");
}

function ciRenderPanel() {
  const panel = $("#ciPanel");
  const scrolls = new Map([...panel.querySelectorAll(".ci-log-body")].map((el) => [el.dataset.log, el.scrollTop]));
  if (!ci.steps) { panel.innerHTML = '<div class="empty">Loading workflow…</div>'; return; }
  panel.innerHTML = '<div class="ci-log-toolbar"><div><strong>Execution logs</strong><span class="log-caption">Quality checks</span></div><span class="ci-time">Local run</span></div>' + ci.steps.filter((st) => ci.enabled.has(st.id) || ci.results[st.id]).map((st) => {
    const r = ci.results[st.id];
    const open = ci.expanded.has(st.id);
    const text = (r?.log ?? "").replace(ANSI, "");
    const placeholder = r?.status === "running" ? "Waiting for output…" : r?.status === "skip" ? "This step was skipped." : r?.status === "cancelled" ? "This step was stopped." : "No output recorded.";
    return `<section class="ci-step" id="ci-step-${esc(st.id)}"><button type="button" class="ci-step-head" data-toggle="${esc(st.id)}" aria-expanded="${open}" aria-controls="ci-body-${esc(st.id)}"><span aria-hidden="true">${open ? "▾" : "▸"}</span><span class="ci-step-label">${esc(st.label)}</span>${ciStatusCell(r)}<span class="ci-time">${fmtMs(r?.ms)}</span></button>${open ? `<div id="ci-body-${esc(st.id)}"><div class="ci-command mono">$ ${esc(st.display)}</div><div class="ci-log-body" data-log="${esc(st.id)}" tabindex="0" aria-label="${esc(st.label)} output">${(text || placeholder).split("\n").map((line, i) => `<div class="ci-log-line"><span class="ci-line-number">${i + 1}</span><span class="ci-line-text">${esc(line)}</span></div>`).join("")}</div></div>` : ""}</section>`;
  }).join("");
  for (const el of panel.querySelectorAll(".ci-log-body")) el.scrollTop = ci.follow && ci.results[el.dataset.log]?.status === "running" ? el.scrollHeight : scrolls.get(el.dataset.log) ?? 0;
}

function ciRender() {
  const busy = !!ci.run;
  const ciRunBtn = $("#ciRun");
  ciRunBtn.textContent = busy ? "Cancel run" : ci.finished ? "Re-run checks" : "Run checks";
  ciRunBtn.classList.toggle("primary", !busy);
  ciRunBtn.disabled = !ci.steps || (!busy && ci.enabled.size === 0);
  $("#ciStop").disabled = busy;
  $("#ciStatus").textContent = busy ? "running…" : !ci.finished ? "idle" : ci.cancelled ? "stopped" : ci.error ? "error" : Object.values(ci.results).some((r) => r.status === "fail") ? "failed" : "passed";
  $("#ciNotice").innerHTML = ci.error
    ? `<div class="error-box">${esc(ci.error)}</div>`
    : (ci.problems ?? []).map((p) => `<div class="error-box">${esc(p)}</div>`).join("");
  const visible = ci.steps?.filter((st) => ci.enabled.has(st.id) || ci.results[st.id]) ?? [];
  $("#ciExpand").textContent = visible.length && visible.every((st) => ci.expanded.has(st.id)) ? "Collapse all logs" : "Expand all logs";
  $("#ciExpand").disabled = !visible.length;
  $("#ciFollow").setAttribute("aria-pressed", String(ci.follow));
  $("#ciRetry").hidden = busy || !Object.values(ci.results).some((r) => r.status === "fail");
  ciRenderStats(); ciRenderVerdict(); ciRenderTable(); ciRenderPanel();
}

let ciRaf = 0;
function ciSoftRender() {
  if (ciRaf) return;
  ciRaf = requestAnimationFrame(() => { ciRaf = 0; ciRenderPanel(); ciRenderStats(); });
}

function ciEvent(e) {
  if (e.type === "start") { ciRes(e.id).status = "running"; if (ci.follow) { ci.selected = e.id; ci.expanded.add(e.id); } ciRender(); }
  else if (e.type === "log") { ciRes(e.id).log += e.text; if (ci.expanded.has(e.id)) ciSoftRender(); }
  else if (e.type === "end") { const r = ciRes(e.id); r.status = e.code === 0 ? "pass" : "fail"; r.ms = e.ms; if (e.code !== 0) { ci.expanded.add(e.id); if (ci.follow) ci.selected = e.id; } else if (ci.follow) ci.expanded.delete(e.id); ciRender(); }
  else if (e.type === "skip") { ciRes(e.id).status = "skip"; ciRender(); }
}

async function ciStart(onlyIds) {
  const ids = onlyIds ?? ci.steps.filter((st) => ci.enabled.has(st.id)).map((st) => st.id);
  if (!ids.length) return;
  ci.expanded.clear();
  ci.results = {};
  for (const id of ids) ciRes(id);
  ci.finished = false; ci.cancelled = false; ci.error = null; ci.seconds = null; ci.follow = true; ci.startedAt = Date.now();
  const ctrl = new AbortController();
  ci.run = ctrl;
  const tick = setInterval(ciRenderStats, 1000);
  ciRender();
  try {
    const res = await fetch("/api/ci/run", {
      method: "POST",
      headers: { "content-type": "application/json", "x-lintlane-token": TOKEN },
      body: JSON.stringify({ steps: ids, stopOnFail: $("#ciStop").checked }),
      signal: ctrl.signal,
    });
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      for (let i = buf.indexOf("\n"); i >= 0; i = buf.indexOf("\n")) {
        const line = buf.slice(0, i);
        buf = buf.slice(i + 1);
        if (line) ciEvent(JSON.parse(line));
      }
    }
  } catch (e) {
    if (e.name === "AbortError") {
      ci.cancelled = true;
      for (const r of Object.values(ci.results)) {
        if (r.status === "running") r.status = "cancelled";
        else if (r.status === "pending") r.status = "skip";
      }
    } else ci.error = e.message;
  } finally {
    clearInterval(tick);
    ci.seconds = Math.round((Date.now() - ci.startedAt) / 1000);
    ci.run = null; ci.finished = true;
    ciRender();
  }
}

$("#ciRun").addEventListener("click", () => (ci.run ? ci.run.abort() : ciStart()));
$("#ciSteps").addEventListener("click", (e) => {
  const box = e.target.closest("[data-enable]");
  if (box) {
    if (box.checked) ci.enabled.add(box.dataset.enable); else ci.enabled.delete(box.dataset.enable);
    ciRender();
    return;
  }
  const job = e.target.closest("[data-select]");
  if (job) {
    ci.selected = job.dataset.select; ci.expanded.add(ci.selected); ci.follow = false; ciRender();
    document.getElementById(`ci-step-${ci.selected}`)?.scrollIntoView({ block: "nearest" });
  }
});

$("#ciPanel").addEventListener("click", (e) => {
  const head = e.target.closest("[data-toggle]");
  if (!head) return;
  const id = head.dataset.toggle;
  if (ci.expanded.has(id)) ci.expanded.delete(id); else ci.expanded.add(id);
  ci.selected = id; ci.follow = false; ciRender();
  $("#ciPanel").querySelector(`[data-toggle="${id}"]`)?.focus();
});
$("#ciExpand").addEventListener("click", () => {
  const visible = ci.steps?.filter((st) => ci.enabled.has(st.id) || ci.results[st.id]) ?? [];
  const allOpen = visible.every((st) => ci.expanded.has(st.id));
  for (const st of visible) { if (allOpen) ci.expanded.delete(st.id); else ci.expanded.add(st.id); }
  ci.follow = false; ciRender();
});
$("#ciFollow").addEventListener("click", () => {
  ci.follow = !ci.follow;
  if (ci.follow) {
    const active = ci.steps?.find((st) => ci.results[st.id]?.status === "running");
    if (active) { ci.selected = active.id; ci.expanded.add(active.id); }
  }
  ciRender();
});
$("#ciRetry").addEventListener("click", () => ciStart(ci.steps.filter((st) => ci.results[st.id]?.status === "fail").map((st) => st.id)));

showView(location.hash === "#ci" ? "ci" : "lint");
</script>
</body>
